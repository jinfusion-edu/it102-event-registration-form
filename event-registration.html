<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Week 4 Assignment: Event Registration</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 2rem; background: #f4f4f9; display: flex; justify-content: center; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 420px; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 0.25rem; font-weight: 500; }
        input, select { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 1rem; }
        button { width: 100%; background: #007bff; color: white; border: none; padding: 0.75rem; border-radius: 4px; cursor: pointer; font-size: 1rem; font-weight: bold; }
        button:hover { background: #0056b3; }
        .error-box { display: none; background: #f8d7da; color: #721c24; padding: 0.75rem; border-radius: 4px; margin-bottom: 1rem; border: 1px solid #f5c6cb; font-size: 0.9rem; }
        .receipt-box { display: none; margin-top: 1.5rem; padding: 1rem; background: #d4edda; color: #155724; border-radius: 4px; border: 1px solid #c3e6cb; }
        .receipt-line { display: flex; justify-content: space-between; margin-bottom: 0.5rem; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Tech Conf 2026 Registration</h2>

        <!-- Error Container for Edge Cases -->
        <div id="errorBox" class="error-box"></div>

        <div class="form-group">
            <label for="fullName">Full Name:</label>
            <input type="text" id="fullName" placeholder="Jane Doe">
        </div>

        <div class="form-group">
            <label for="ticketQuantity">Number of Tickets:</label>
            <input type="number" id="ticketQuantity" placeholder="1">
        </div>

        <div class="form-group">
            <label for="ticketType">Ticket Type:</label>
            <select id="ticketType">
                <option value="">-- Select Ticket --</option>
                <option value="standard">Standard ($50)</option>
                <option value="vip">VIP ($120)</option>
            </select>
        </div>

        <button id="registerBtn">Purchase Tickets</button>

        <!-- Success Receipt Container -->
        <div id="receiptBox" class="receipt-box">
            <h3>Registration Successful!</h3>
            <div class="receipt-line"><span>Attendee:</span> <span id="receiptName">---</span></div>
            <div class="receipt-line"><span>Tickets:</span> <span id="receiptQty">0</span></div>
            <div class="receipt-line"><strong>Total Price:</strong> <strong id="receiptTotal">$0.00</strong></div>
        </div>
    </div>

    <script>
        /* ================================================================
           STEP 1 — the Happy Path function.
           Assumes clean input. That assumption is exactly what Step 2
           exists to defend against.
           ================================================================ */
        function calculateRegistration(quantity, ticketType) {
            var pricePerTicket = 0;

            if (ticketType === "standard") {
                pricePerTicket = 50;
            } else if (ticketType === "vip") {
                pricePerTicket = 120;
            }

            return quantity * pricePerTicket;
        }

        /* ================================================================
           STEP 2 — the validation gate.

           ORDER IS LOAD-BEARING. Each check returns the FIRST failure it
           finds, so a blank name reports the name error even when the
           quantity is also wrong. Reordering these changes which message
           the assignment's Test 1 produces.
           ================================================================ */
        function validateInputs(name, quantity, ticketType) {
            // 1. Blank, or nothing but spaces. trim() removes the spaces so
            //    "   " collapses to "" and is correctly rejected.
            if (name === undefined || name === null || name.trim() === "") {
                return "Name field cannot be left blank.";
            }

            // 2. The placeholder <option> carries value="", so an untouched
            //    dropdown lands here.
            if (ticketType === undefined || ticketType === null || ticketType === "") {
                return "Please select a valid ticket type.";
            }

            // 3. Zero or negative. This is the check that stops the form
            //    from "paying the user" -3 tickets at -$360.
            if (quantity <= 0) {
                return "Ticket quantity must be at least 1.";
            }

            // 4. Whole numbers only. Number.isInteger is used rather than
            //    (quantity % 1 === 0) because it also rejects NaN and
            //    Infinity rather than letting them through.
            if (!Number.isInteger(quantity)) {
                return "You cannot purchase fractional tickets.";
            }

            return true;
        }

        /* ================================================================
           STEP 3 — implement and connect.
           ================================================================ */
        var nameInput = document.getElementById("fullName");
        var quantityInput = document.getElementById("ticketQuantity");
        var typeInput = document.getElementById("ticketType");
        var registerButton = document.getElementById("registerBtn");

        var errorBox = document.getElementById("errorBox");
        var receiptBox = document.getElementById("receiptBox");
        var receiptName = document.getElementById("receiptName");
        var receiptQty = document.getElementById("receiptQty");
        var receiptTotal = document.getElementById("receiptTotal");

        registerButton.addEventListener("click", function () {
            var enteredName = nameInput.value;
            var enteredType = typeInput.value;

            // Input values are strings. Number() converts before we compare
            // or multiply, so "-3" becomes the number -3 and actually fails
            // the `quantity <= 0` test instead of being compared as text.
            var enteredQuantity = Number(quantityInput.value);

            var validationResult = validateInputs(enteredName, enteredQuantity, enteredType);

            if (validationResult !== true) {
                // Failure: show the message, and make sure no stale receipt
                // from a previous successful attempt is left on screen.
                receiptBox.style.display = "none";
                errorBox.textContent = validationResult;
                errorBox.style.display = "block";
            } else {
                // Success: clear any previous error, then build the receipt.
                errorBox.style.display = "none";

                var total = calculateRegistration(enteredQuantity, enteredType);

                receiptName.textContent = enteredName.trim();
                receiptQty.textContent = enteredQuantity;
                receiptTotal.textContent = "$" + total.toFixed(2);

                receiptBox.style.display = "block";
            }
        });
    </script>
</body>
</html>
